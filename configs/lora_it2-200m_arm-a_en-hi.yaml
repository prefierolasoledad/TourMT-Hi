# LoRA fine-tuning of IndicTrans2-200M on arm A data (plan section 5.2).
# Run (venv-eval): python src/train_lora.py --config configs/lora_it2-200m_arm-a_en-hi.yaml --seed 42
# Plan: 3 seeds (42, 43, 44). Output: checkpoints/<run_name>_s<seed>/adapter + results/train_<run_name>_s<seed>.json
run_name: lora_it2-200m_arm-a_en-hi
base_model: ai4bharat/indictrans2-en-indic-dist-200M
revision: 2cfd0a20057756d756bf3e53528f492afc52f91a   # same pinned commit as the baseline
direction: en-hi
data_dir: data/finetune/arm_a                          # train.tsv + dev.tsv from build_finetune_data.py
max_length: 256

# LoRA: small trainable matrices next to the frozen weights. r = their size (rank); alpha/r scales them.
# AI4Bharat's own example uses r 16, alpha 32, dropout 0.1 on q_proj,k_proj; we also adapt v_proj and
# out_proj (all attention projections) - still only ~1-2% of the parameters.
lora:
  r: 16
  alpha: 32
  dropout: 0.1
  target_modules: [q_proj, k_proj, v_proj, out_proj]

training:
  learning_rate: 3.0e-4
  lr_scheduler: inverse_sqrt    # as in AI4Bharat's LoRA example
  warmup_steps: 200
  weight_decay: 0.01
  label_smoothing: 0.1
  batch_size: 32                # fits a T4 with fp16
  grad_accum_steps: 1
  max_epochs: 10                # upper limit; early stopping usually ends earlier
  eval_steps: 200               # dev loss every 200 steps (~half an epoch)
  patience: 5                   # stop after 5 evaluations without improvement
  fp16: true

seed: 42
output_root: checkpoints        # gitignored; adapters are uploaded to your private Hugging Face repo
