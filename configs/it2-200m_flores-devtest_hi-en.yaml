# Zero-shot baseline (plan section 5.1). Run: python src/translate.py --config configs/it2-200m_flores-devtest_hi-en.yaml
run_name: it2-200m_flores-devtest_hi-en
model: ai4bharat/indictrans2-indic-en-dist-200M
model_family: indictrans2
revision: d66a2122ad6d28184f3dc3797b652bd80ae3f65f  # pinned model commit (code + weights)
test_set: flores
split: devtest
direction: hi-en
decoding:
  num_beams: 4
  max_length: 256
  batch_size: 16
  use_cache: false  # IndicTrans2's remote code breaks with the new transformers cache; output is identical, only slower
fp16: true
seed: 42
output_root: outputs
